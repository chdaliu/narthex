<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Narthex</title>
<link rel="stylesheet" href="/app.css?v=35">
<link rel="icon" href="/assets/icons/sparkles.svg" type="image/svg+xml">
</head>
<body>
<div class="bg" id="bg"></div>

<section id="login-view" class="center-view" hidden>
  <form id="login-form" class="panel glass">
    <img src="/assets/icons/sparkles.svg" class="login-logo" alt="">
    <h1>Narthex</h1>
    <p class="muted" data-i18n="login.subtitle">输入用户名与密码以管理你的服务</p>
    <input type="text" id="username" placeholder="Username" data-i18n-placeholder="login.username" autocomplete="username" required>
    <input type="password" id="password" placeholder="Password" data-i18n-placeholder="login.placeholder" autocomplete="current-password" required>
    <p id="login-error" class="error" hidden></p>
    <button type="submit" class="btn primary" id="login-btn" data-i18n="login.submit">进入</button>
  </form>
</section>

<section id="app-view" hidden>
  <header class="topbar panel glass">
    <div class="brand">
      <img src="/assets/icons/sparkles.svg" alt="">
      <h1>Narthex</h1>
      <span id="slogan" class="slogan" hidden></span>
    </div>
    <button id="btn-menu" class="btn icon-btn menu-btn" data-i18n-title="topbar.menu" title="菜单">
      <img id="menu-icon" src="/assets/icons/menu.svg" alt="">
    </button>
    <div class="topbar-actions" id="topbar-actions">
      <button id="btn-add" class="btn primary" data-i18n="topbar.add">＋ 添加卡片</button>
      <button id="btn-settings" class="btn ghost" data-i18n="topbar.settings">设置</button>
      <button id="btn-account" class="btn ghost" data-i18n="topbar.account">账号</button>
      <button id="btn-logout" class="btn ghost" data-i18n="topbar.logout">退出</button>
    </div>
  </header>
  <main id="grid"></main>
  <p id="empty" class="muted empty" data-i18n="empty" hidden>还没有卡片,点击「添加卡片」开始</p>
</section>

<section id="account-view" class="center-view" hidden>
  <form id="account-form" class="panel glass">
    <h2 data-i18n="account.title">账号设置</h2>
    <div class="field-label" data-i18n="account.username">用户名</div>
    <input type="text" id="acct-username" maxlength="32" autocomplete="username">
    <div class="field-label" data-i18n="account.currentPassword">当前密码</div>
    <input type="password" id="acct-cur-pw" autocomplete="current-password">
    <div class="field-label" data-i18n="account.newPassword">新密码</div>
    <input type="password" id="acct-new-pw" autocomplete="new-password">
    <div class="field-label" data-i18n="account.confirmPassword">确认新密码</div>
    <input type="password" id="acct-confirm-pw" autocomplete="new-password">
    <p id="acct-msg" class="acct-msg" hidden></p>
    <div class="account-actions">
      <button type="button" class="btn ghost" id="btn-account-back" data-i18n="account.back">返回</button>
      <button type="submit" class="btn primary" id="btn-account-save" data-i18n="account.save">保存修改</button>
    </div>
  </form>
</section>

<div id="modal-root" hidden></div>

<script src="/i18n.js?v=34"></script>
<script src="/app.js?v=34"></script>
</body>
</html>
